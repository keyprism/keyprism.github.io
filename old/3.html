    function saveCart() { localStorage.setItem('vv_cart', JSON.stringify(state.cart)); }
    function saveWishlist() { localStorage.setItem('vv_wishlist', JSON.stringify(state.wishlist)); }

    // ==========================================
    // UTILITY FUNCTIONS
    // ==========================================
    function formatPrice(p) { return '$' + p.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

    function starsHTML(rating, size = 14) {
        let s = '';
        for (let i = 1; i <= 5; i++) {
            if (i <= Math.floor(rating)) s += `<i data-lucide="star" class="inline-block text-amber-400" style="width:${size}px;height:${size}px;fill:currentColor;"></i>`;
            else if (i - rating < 1) s += `<i data-lucide="star" class="inline-block text-amber-400" style="width:${size}px;height:${size}px;fill:currentColor;opacity:0.5;"></i>`;
            else s += `<i data-lucide="star" class="inline-block text-slate-200" style="width:${size}px;height:${size}px;"></i>`;
        }
        return s;
    }

    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

    function getProduct(id) { return products.find(p => p.id === id); }

    function cartItemCount() { return state.cart.reduce((s, i) => s + i.quantity, 0); }
    function cartSubtotal() { return state.cart.reduce((s, i) => { const p = getProduct(i.productId); return s + (p ? p.price * i.quantity : 0); }, 0); }
    function cartTax() { return cartSubtotal() * 0.08; }
    function cartTotal() { return Math.max(0, cartSubtotal() + cartTax() + (cartSubtotal() >= 99 ? 0 : 9.99) - state.promoDiscount); }
    function cartShipping() { return cartSubtotal() >= 99 ? 0 : 9.99; }

    function isWished(id) { return state.wishlist.includes(id); }

    function slugify(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

    // ==========================================
    // CART OPERATIONS
    // ==========================================
    function addToCart(productId, qty = 1) {
        const product = getProduct(productId);
        if (!product || !product.inStock) return;
        const existing = state.cart.find(i => i.productId === productId);
        const maxQty = Math.min(qty, product.stockQuantity);
        if (existing) {
            existing.quantity = Math.min(existing.quantity + maxQty, product.stockQuantity);
        } else {
            state.cart.push({ productId, quantity: maxQty, addedAt: new Date().toISOString() });
        }
        saveCart();
        updateCartBadge();
        showToast(`Added to cart: ${product.name}`, 'success');
        // Animate the add-to-cart button if visible
        const btn = document.querySelector(`[data-action="add-to-cart"][data-product-id="${productId}"]`);
        if (btn) {
            btn.innerHTML = '<i data-lucide="check" class="w-5 h-5 mx-auto"></i>';
            btn.classList.add('bg-eco-500');
            btn.classList.remove('bg-volt-500','hover:bg-volt-600');
            lucide.createIcons({ nodes: [btn] });
            setTimeout(() => {
                btn.innerHTML = '<i data-lucide="shopping-cart" class="w-5 h-5 mx-auto"></i>';
                btn.classList.remove('bg-eco-500');
                btn.classList.add('bg-volt-500','hover:bg-volt-600');
                lucide.createIcons({ nodes: [btn] });
            }, 1200);
        }
        // Update mobile sticky bar if visible
        renderMobileStickyBar();
    }

    function removeFromCart(productId) {
        const product = getProduct(productId);
        state.cart = state.cart.filter(i => i.productId !== productId);
        saveCart();
        updateCartBadge();
        if (product) showToast(`Removed: ${product.name}`, 'info');
        renderPage();
    }

    function updateQuantity(productId, qty) {
        const product = getProduct(productId);
        const item = state.cart.find(i => i.productId === productId);
        if (!item || !product) return;
        item.quantity = Math.max(1, Math.min(qty, product.stockQuantity));
        saveCart();
        updateCartBadge();
        renderPage();
    }

    function applyPromo(code) {
        state.promoMessage = '';
        state.promoDiscount = 0;
        if (code.trim().toUpperCase() === 'SAVE10') {
            state.promoDiscount = cartSubtotal() * 0.10;
            state.promoMessage = 'success';
            showToast('Promo code applied: 10% off', 'success');
        } else if (code.trim().toUpperCase() === 'VOLT50') {
            state.promoDiscount = 50;
            state.promoMessage = 'success';
            showToast('Promo code applied: $50 off', 'success');
        } else if (code.trim()) {
            state.promoMessage = 'error';
        }
        renderPage();
    }

    function toggleWishlist(productId) {
        const idx = state.wishlist.indexOf(productId);
        if (idx > -1) { state.wishlist.splice(idx, 1); showToast('Removed from wishlist', 'info'); }
        else { state.wishlist.push(productId); showToast('Added to wishlist', 'success'); }
        saveWishlist();
        renderPage();
    }

    // ==========================================
    // TOAST NOTIFICATIONS
    // ==========================================
    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const colors = { success: 'bg-eco-500', error: 'bg-red-500', info: 'bg-volt-500' };
        const icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
        const id = 'toast-' + Date.now();
        const el = document.createElement('div');
        el.id = id;
        el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-medium shadow-lg animate-toast-in ${colors[type] || colors.info}`;
        el.setAttribute('role', 'alert');
        el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 flex-shrink-0"></i><span class="flex-1">${message}</span><button data-action="close-toast" data-toast-id="${id}" class="ml-2 hover:opacity-70" aria-label="Close notification"><i data-lucide="x" class="w-4 h-4"></i></button>`;
        container.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        setTimeout(() => { const t = document.getElementById(id); if (t) { t.classList.add('toast-exit'); setTimeout(() => t.remove(), 300); } }, 4000);
    }

    // ==========================================
    // FILTER / SORT LOGIC
    // ==========================================
    function getFilteredProducts() {
        let filtered = [...products];
        const f = state.filters;
        if (f.search) {
            const q = f.search.toLowerCase();
            filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
        }
        if (f.categories.length) filtered = filtered.filter(p => f.categories.includes(p.category));
        if (f.brands.length) filtered = filtered.filter(p => f.brands.includes(p.brand));
        if (f.compatibility.length) filtered = filtered.filter(p => p.compatibility.some(c => f.compatibility.includes(c)));
        if (f.priceRange) {
            const [min, max] = f.priceRange;
            filtered = filtered.filter(p => p.price >= min && (max === Infinity || p.price <= max));
        }
        if (f.rating) filtered = filtered.filter(p => p.rating >= f.rating);
        if (f.inStockOnly) filtered = filtered.filter(p => p.inStock);

        // Sort
        switch (state.sort) {
            case 'price-asc': filtered.sort((a, b) => a.price - b.price); break;
            case 'price-desc': filtered.sort((a, b) => b.price - a.price); break;
            case 'rating': filtered.sort((a, b) => b.rating - a.rating); break;
            case 'newest': filtered.sort((a, b) => (b.tags.includes('new') ? 1 : 0) - (a.tags.includes('new') ? 1 : 0)); break;
            default: filtered.sort((a, b) => (b.tags.includes('bestseller') ? 1 : 0) - (a.tags.includes('bestseller') ? 1 : 0));
        }
        return filtered;
    }

    function activeFilterCount() {
        const f = state.filters;
        let c = 0;
        if (f.search) c++;
        if (f.categories.length) c += f.categories.length;
        if (f.brands.length) c += f.brands.length;
        if (f.compatibility.length) c += f.compatibility.length;
        if (f.priceRange) c++;
        if (f.rating) c++;
        if (f.inStockOnly) c++;
        return c;
    }

    function clearFilters() {
        state.filters = { search: '', categories: [], brands: [], priceRange: null, rating: 0, inStockOnly: false, compatibility: [] };
        state.promoCode = '';
        state.promoDiscount = 0;
        state.promoMessage = '';

    }

    // ==========================================
    // SEARCH FUNCTIONALITY
    // ==========================================
    function handleSearch(query, dropdownId) {
        const dropdown = document.getElementById(dropdownId);
        if (!query.trim()) { dropdown.classList.add('hidden'); return; }
        const q = query.toLowerCase();
        const results = products.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q)).slice(0, 5);
        if (!results.length) {
            dropdown.innerHTML = `<div class="p-4 text-sm text-slate-500 text-center">No results found for "${query}"</div>`;
        } else {
            dropdown.innerHTML = results.map(p => `
                <a href="#product" data-action="view-product" data-product-id="${p.id}" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 transition-colors">
                    <img src="${p.image}" alt="" class="w-10 h-10 rounded-lg object-cover flex-shrink-0">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-slate-800 truncate">${p.name}</p>
                        <p class="text-xs text-slate-400">${p.category} &middot; ${p.sku}</p>
                    </div>
                    <span class="text-sm font-semibold text-slate-900 flex-shrink-0">${formatPrice(p.price)}</span>
                </a>`).join('');
        }
        dropdown.classList.remove('hidden');
    }

    function filterSectionHTML(title, type, items) {
        const selected = type === 'category' ? state.filters.categories : type === 'brand' ? state.filters.brands : state.filters.compatibility;
        return `
        <div class="bg-white rounded-xl border border-slate-200/80 p-4">
            <h3 class="text-sm font-semibold text-slate-800 mb-3">${title}</h3>
            <div class="space-y-2 max-h-48 overflow-y-auto">
                ${items.map(item => `
                <label class="flex items-center gap-2.5 cursor-pointer group">
                    <input type="checkbox" class="custom-check" data-action="toggle-filter" data-filter-type="${type}" data-filter-value="${item.value}" ${selected.includes(item.value) ? 'checked' : ''}>
                    <span class="text-sm text-slate-600 group-hover:text-slate-800 flex-1 truncate transition-colors">${item.label}</span>
                    <span class="text-xs text-slate-400">${item.count}</span>
                </label>`).join('')}
            </div>
        </div>`;
    }

                <img src="${p.image}" alt="${p.name}" loading="lazy" class="w-full h-full object-cover">

            <div class="flex-1 p-4 flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6">

                    <div class="flex items-center gap-1.5 mb-1">
                        <div class="flex">${starsHTML(p.rating, 12)}</div>
                        <span class="text-xs text-slate-400">(${p.reviewCount})</span>

                    <a href="#product" data-action="view-product" data-product-id="${p.id}" class="text-base font-semibold text-slate-800 hover:text-volt-500 transition-colors mb-1 line-clamp-1">${p.name}</a>

                    <button data-action="add-to-cart" data-product-id="${p.id}" ${!p.inStock ? 'disabled' : ''} class="w-10 h-10 rounded-lg ${p.inStock ? 'bg-volt-500 hover:bg-volt-600 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'} flex items-center justify-center transition-colors" aria-label="Add to cart">
                        <i data-lucide="shopping-cart" class="w-4 h-4"></i>

                                    <div>
                                        <label for="checkout-expiry" class="block text-sm font-medium text-slate-700 mb-1.5">Expiry Date <span class="text-red-500">*</span></label>
                                        <input type="text" id="checkout-expiry" required placeholder="MM/YY" maxlength="5" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm focus:border-volt-500 focus:ring-2 focus:ring-volt-500/20 outline-none transition-all font-mono" aria-required="true">
                                        <p class="text-xs text-red-500 mt-1 hidden" data-error="checkout-expiry">Enter valid expiry (MM/YY)</p>
                                    </div>
                                    <div>
                                        <label for="checkout-cvc" class="block text-sm font-medium text-slate-700 mb-1.5">CVC <span class="text-red-500">*</span></label>
                                        <input type="text" id="checkout-cvc" required placeholder="123" maxlength="4" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm focus:border-volt-500 focus:ring-2 focus:ring-volt-500/20 outline-none transition-all font-mono" aria-required="true">
                                        <p class="text-xs text-red-500 mt-1 hidden" data-error="checkout-cvc">Enter valid CVC</p>
                                    </div>
                                </div>
                                <div>
                                    <label for="checkout-cardname" class="block text-sm font-medium text-slate-700 mb-1.5">Name on Card <span class="text-red-500">*</span></label>
                                    <input type="text" id="checkout-cardname" required placeholder="John Doe" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-sm focus:border-volt-500 focus:ring-2 focus:ring-volt-500/20 outline-none transition-all" aria-required="true">
                                    <p class="text-xs text-red-500 mt-1 hidden" data-error="checkout-cardname">Name on card is required</p>
                                </div>
                            </div>
                        </div>

                        <button type="submit" data-action="place-order" class="w-full py-4 px-6 bg-volt-500 hover:bg-volt-600 text-white font-bold text-base rounded-lg transition-colors shadow-lg shadow-volt-500/20 flex items-center justify-center gap-2">
                            <i data-lucide="lock" class="w-4 h-4"></i> Place Order — ${formatPrice(cartTotal())}
                        </button>
                    </form>
                </div>

                <!-- Order Summary Sidebar -->
                <div class="w-full lg:w-80 flex-shrink-0 page-enter" style="animation-delay:0.1s">
                    <div class="sticky top-24 bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm">
                        <h2 class="text-lg font-bold text-slate-900 mb-5">Order Summary</h2>
                        <div class="space-y-3 max-h-64 overflow-y-auto mb-5">
                            ${state.cart.map(item => {
                                const p = getProduct(item.productId);
                                if (!p) return '';
                                return `
                                <div class="flex items-center gap-3">
                                    <div class="relative w-14 h-14 rounded-lg overflow-hidden bg-slate-100 flex-shrink-0">
                                        <img src="${p.image}" alt="" class="w-full h-full object-cover">
                                        <span class="absolute -top-1 -right-1 w-5 h-5 bg-slate-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">${item.quantity}</span>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium text-slate-800 truncate">${p.name}</p>
                                        <p class="text-xs text-slate-400">Qty: ${item.quantity}</p>
                                    </div>
                                    <span class="text-sm font-semibold text-slate-700 flex-shrink-0">${formatPrice(p.price * item.quantity)}</span>
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="space-y-2.5 py-4 border-t border-slate-100">
                            <div class="flex justify-between text-sm"><span class="text-slate-500">Subtotal</span><span class="text-slate-700">${formatPrice(cartSubtotal())}</span></div>
                            <div class="flex justify-between text-sm"><span class="text-slate-500">Shipping</span><span class="${cartShipping() === 0 ? 'text-eco-600' : 'text-slate-700'}">${cartShipping() === 0 ? 'Free' : formatPrice(cartShipping())}</span></div>
                            <div class="flex justify-between text-sm"><span class="text-slate-500">Tax</span><span class="text-slate-700">${formatPrice(cartTax())}</span></div>
                            ${state.promoDiscount > 0 ? `<div class="flex justify-between text-sm"><span class="text-eco-600">Discount</span><span class="text-eco-600">-${formatPrice(state.promoDiscount)}</span></div>` : ''}
                        </div>
                        <div class="flex justify-between items-center py-4 border-t border-slate-200">
                            <span class="text-base font-bold text-slate-900">Total</span>
                            <span class="text-xl font-bold text-slate-900">${formatPrice(cartTotal())}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Order Success Modal (hidden by default) -->
        <div id="order-success-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4" style="display:none;">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center animate-bounce-in">
                <div class="w-16 h-16 mx-auto mb-5 bg-eco-50 rounded-full flex items-center justify-center"><i data-lucide="check-circle" class="w-9 h-9 text-eco-500"></i></div>
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Order Placed</h2>
                <p class="text-slate-500 mb-2">Thank you for your purchase! Your order has been confirmed.</p>
                <p class="text-sm text-slate-400 mb-6">Order #VV-${Date.now().toString(36).toUpperCase()}</p>
                <div class="bg-slate-50 rounded-xl p-4 mb-6 text-left space-y-2">
                    <p class="text-xs text-slate-500">Estimated Delivery</p>
                    <p class="text-sm font-semibold text-slate-800">${new Date(Date.now() + 5 * 86400000).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
                </div>
                <a href="#home" data-action="navigate" data-page="home" class="block w-full py-3.5 bg-volt-500 hover:bg-volt-600 text-white font-semibold rounded-lg transition-colors mb-3">Continue Shopping</a>
                <p class="text-xs text-slate-400">A confirmation email will be sent shortly.</p>
            </div>
        </div>`;

        lucide.createIcons({ nodes: [main] });

        // Card number formatting
        const cardInput = document.getElementById('checkout-card');
        if (cardInput) {
            cardInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 16);
                e.target.value = v.replace(/(.{4})/g, '$1 ').trim();
            });
        }
        // Expiry formatting
        const expiryInput = document.getElementById('checkout-expiry');
        if (expiryInput) {
            expiryInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, '').substring(0, 4);
                if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
                e.target.value = v;
            });
        }
    }

    // ==========================================
    // ORDER PLACEMENT
    // ==========================================
    function placeOrder() {
        const fields = [
            { id: 'checkout-email', validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
            { id: 'checkout-fname', validate: v => v.trim().length > 0 },
            { id: 'checkout-lname', validate: v => v.trim().length > 0 },
            { id: 'checkout-address', validate: v => v.trim().length > 0 },
            { id: 'checkout-city', validate: v => v.trim().length > 0 },
            { id: 'checkout-zip', validate: v => v.trim().length >= 3 },
            { id: 'checkout-card', validate: v => v.replace(/\s/g, '').length >= 13 },
            { id: 'checkout-expiry', validate: v => /^\d{2}\/\d{2}$/.test(v) },
            { id: 'checkout-cvc', validate: v => v.length >= 3 },
            { id: 'checkout-cardname', validate: v => v.trim().length > 0 }
        ];

        let valid = true;
        fields.forEach(f => {
            const el = document.getElementById(f.id);
            const err = document.querySelector(`[data-error="${f.id}"]`);
            if (!el) return;
            if (!f.validate(el.value)) {
                valid = false;
                el.classList.add('border-red-400', 'ring-1', 'ring-red-200');
                el.classList.remove('border-slate-200');
                if (err) err.classList.remove('hidden');
            } else {
                el.classList.remove('border-red-400', 'ring-1', 'ring-red-200');
                el.classList.add('border-slate-200');
                if (err) err.classList.add('hidden');
            }
        });

        if (!valid) {
            showToast('Please fill in all required fields correctly', 'error');
            return;
        }

        // Show success modal
        const modal = document.getElementById('order-success-modal');
        if (modal) {
            modal.style.display = 'flex';
            modal.classList.remove('hidden');
            lucide.createIcons({ nodes: [modal] });
        }

        // Clear cart
        state.cart = [];
        saveCart();
        updateCartBadge();
        showToast('Order placed successfully!', 'success');
    }

    // ==========================================
    // RENDER ORCHESTRATOR
    // ==========================================
    function renderPage() {
        const main = document.getElementById('main-content');
        main.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: 'instant' });
        document.getElementById('mobile-sticky-bar').classList.add('hidden');

        switch (state.page) {
            case 'home': renderHome(); break;
            case 'catalog': renderCatalog(); break;
            case 'product': renderProduct(); break;
            case 'cart': renderCart(); break;
            case 'checkout': renderCheckout(); break;
            default: renderHome();
        }

        renderHeader();
        renderMobileMenu();
        updateCartBadge();

        // Attach search listeners
        const headerSearch = document.getElementById('header-search');
        const mobileSearch = document.getElementById('mobile-search');
        if (headerSearch) {
            headerSearch.addEventListener('input', debounce((e) => handleSearch(e.target.value, 'search-dropdown'), 300));
            headerSearch.addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.filters.search = e.target.value; navigateTo('catalog'); } });
        }
        if (mobileSearch) {
            mobileSearch.addEventListener('input', debounce((e) => handleSearch(e.target.value, 'mobile-search-dropdown'), 300));
            mobileSearch.addEventListener('keydown', (e) => { if (e.key === 'Enter') { state.filters.search = e.target.value; navigateTo('catalog'); closeMobileSearch(); } });
        }

        // Close search dropdowns on outside click
        document.addEventListener('click', (e) => {
            const dd = document.getElementById('search-dropdown');
            const wrap = document.getElementById('header-search-wrap');
            if (dd && wrap && !wrap.contains(e.target)) dd.classList.add('hidden');
            const mdd = document.getElementById('mobile-search-dropdown');
            const msb = document.getElementById('mobile-search-bar');
            if (mdd && msb && !msb.contains(e.target)) mdd.classList.add('hidden');
        });
    }

    // ==========================================
    // NAVIGATION
    // ==========================================
    function navigateTo(page, opts = {}) {
        state.page = page;
        if (opts.productId) state.selectedProductId = opts.productId;
        if (opts.category && page === 'catalog') {
            state.filters.categories = [opts.category];
        }
        if (page === 'product') {
            state.galleryIndex = 0;
            state.activeTab = 'description';
        }
        renderPage();
    }

    // ==========================================
    // MOBILE MENU / FILTER OPEN/CLOSE
    // ==========================================
    function openMobileMenu() {
        renderMobileMenu();
        const overlay = document.getElementById('mobile-overlay');
        const menu = document.getElementById('mobile-menu');
        overlay.classList.remove('hidden');
        requestAnimationFrame(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); menu.classList.remove('translate-x-full'); });
        document.body.style.overflow = 'hidden';
    }
    function closeMobileMenu() {
        const overlay = document.getElementById('mobile-overlay');
        const menu = document.getElementById('mobile-menu');
        overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0');
        menu.classList.add('translate-x-full');
        setTimeout(() => { overlay.classList.add('hidden'); document.body.style.overflow = ''; }, 300);
    }
    function openFilters() {
        renderFilterPanel();
        const overlay = document.getElementById('filter-overlay');
        const panel = document.getElementById('filter-panel');
        overlay.classList.remove('hidden');
        requestAnimationFrame(() => { overlay.classList.remove('opacity-0'); overlay.classList.add('opacity-100'); panel.classList.remove('translate-x-full'); });
        document.body.style.overflow = 'hidden';
    }
    function closeFilters() {
        const overlay = document.getElementById('filter-overlay');
        const panel = document.getElementById('filter-panel');
        overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0');
        panel.classList.add('translate-x-full');
        setTimeout(() => { overlay.classList.add('hidden'); document.body.style.overflow = ''; renderPage(); }, 300);
    }
    function closeMobileSearch() {
        document.getElementById('mobile-search-bar').classList.add('hidden');
    }

    // ==========================================
    // EVENT DELEGATION
    // ==========================================
    document.addEventListener('click', (e) => {
        const target = e.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;

        switch (action) {
            case 'navigate': {
                e.preventDefault();
                closeMobileMenu();
                navigateTo(target.dataset.page, { category: target.dataset.category });
                break;
            }
            case 'view-product': {
                e.preventDefault();
                navigateTo('product', { productId: target.dataset.productId });
                break;
            }
            case 'add-to-cart': {
                e.preventDefault();
                addToCart(target.dataset.productId, 1);
                break;
            }
            case 'add-to-cart-detail': {
                e.preventDefault();
                const qtyEl = document.getElementById('product-qty');
                const qty = qtyEl ? parseInt(qtyEl.value) || 1 : 1;
                addToCart(target.dataset.productId, qty);
                break;
            }
            case 'toggle-wishlist': {
                e.preventDefault();
                toggleWishlist(target.dataset.productId);
                break;
            }
            case 'remove-from-cart': {
                e.preventDefault();
                removeFromCart(target.dataset.productId);
                break;
            }
            case 'cart-qty': {
                e.preventDefault();
                const item = state.cart.find(i => i.productId === target.dataset.productId);
                if (item) {
                    const delta = parseInt(target.dataset.delta);
                    const newQty = item.quantity + delta;
                    if (newQty < 1) removeFromCart(target.dataset.productId);
                    else updateQuantity(target.dataset.productId, newQty);
                }
                break;
            }
            case 'qty-change': {
                e.preventDefault();
                const qtyEl = document.getElementById('product-qty');
                if (qtyEl) {
                    let val = parseInt(qtyEl.value) || 1;
                    val += parseInt(target.dataset.delta);
                    const product = getProduct(state.selectedProductId);
                    val = Math.max(1, Math.min(val, product ? product.stockQuantity : 99));
                    qtyEl.value = val;
                }
                break;
            }
            case 'set-gallery': {
                e.preventDefault();
                state.galleryIndex = parseInt(target.dataset.index);
                const img = document.getElementById('main-product-image');
                const p = getProduct(state.selectedProductId);
                if (img && p) img.src = p.images[state.galleryIndex];
                // Update thumbnail borders
                document.querySelectorAll('[data-action="set-gallery"]').forEach((btn, i) => {
                    btn.classList.toggle('border-volt-500', i === state.galleryIndex);
                    btn.classList.toggle('border-transparent', i !== state.galleryIndex);
                });
                break;
            }
            case 'set-tab': {
                e.preventDefault();
                state.activeTab = target.dataset.tab;
                renderPage();
                break;
            }
            case 'set-view': {
                e.preventDefault();
                state.viewMode = target.dataset.view;
                renderPage();
                break;
            }
            case 'open-mobile-menu': openMobileMenu(); break;
            case 'close-mobile-menu': closeMobileMenu(); break;
            case 'open-mobile-search': {
                e.preventDefault();
                const bar = document.getElementById('mobile-search-bar');
                bar.classList.toggle('hidden');
                if (!bar.classList.contains('hidden')) {
                    document.getElementById('mobile-search').focus();
                }
                break;
            }
            case 'close-mobile-search': closeMobileSearch(); break;
            case 'open-filters': openFilters(); break;
            case 'close-filters': closeFilters(); break;
            case 'close-toast': {
                const toast = document.getElementById(target.dataset.toastId);
                if (toast) { toast.classList.add('toast-exit'); setTimeout(() => toast.remove(), 300); }
                break;
            }
            case 'toggle-filter': {
                const type = target.dataset.filterType;
                const value = target.dataset.filterValue;
                let arr;
                if (type === 'category') arr = state.filters.categories;
                else if (type === 'brand') arr = state.filters.brands;
                else if (type === 'compatibility') arr = state.filters.compatibility;
                const idx = arr.indexOf(value);
                if (idx > -1) arr.splice(idx, 1); else arr.push(value);
                renderPage();
                break;
            }
            case 'toggle-instock': {
                state.filters.inStockOnly = !state.filters.inStockOnly;
                renderPage();
                break;
            }
            case 'set-rating': {
                const val = parseInt(target.value);
                state.filters.rating = state.filters.rating === val ? 0 : val;
                renderPage();
                break;
            }
            case 'set-price': {
                const min = parseInt(target.dataset.min);
                const max = parseInt(target.dataset.max);
                state.filters.priceRange = state.filters.priceRange && state.filters.priceRange[0] === min && state.filters.priceRange[1] === max ? null : [min, max];
                renderPage();
                break;
            }
            case 'apply-price': {
                const minEl = document.getElementById('price-min') || document.getElementById('m-price-min');
                const maxEl = document.getElementById('price-max') || document.getElementById('m-price-max');
                const min = minEl && minEl.value ? parseFloat(minEl.value) : 0;
                const max = maxEl && maxEl.value ? parseFloat(maxEl.value) : Infinity;
                state.filters.priceRange = [min, max];
                renderPage();
                break;
            }
            case 'clear-filter': {
                e.preventDefault();
                const type = target.dataset.filter;
                const value = target.dataset.value;
                if (type === 'search') state.filters.search = '';
                else if (type === 'category') state.filters.categories = state.filters.categories.filter(c => c !== value);
                else if (type === 'brand') state.filters.brands = state.filters.brands.filter(b => b !== value);
                else if (type === 'priceRange') state.filters.priceRange = null;
                else if (type === 'rating') state.filters.rating = 0;
                else if (type === 'inStockOnly') state.filters.inStockOnly = false;
                renderPage();
                break;
            }
            case 'clear-all-filters': {
                e.preventDefault();
                clearFilters();
                break;
            }
            case 'apply-promo': {
                e.preventDefault();
                const input = document.getElementById('promo-input');
                if (input) { state.promoCode = input.value; applyPromo(state.promoCode); }
                break;
            }
            case 'place-order': {
                e.preventDefault();
                placeOrder();
                break;
            }
            case 'newsletter': {
                e.preventDefault();
                showToast('Thanks for subscribing! Check your inbox for a welcome discount.', 'success');
                e.target.reset();
                break;
            }
        }
    });

    // Close mobile menu/filter on overlay click
    document.getElementById('mobile-overlay').addEventListener('click', closeMobileMenu);
    document.getElementById('filter-overlay').addEventListener('click', closeFilters);

    // ==========================================
    // HASH ROUTING
    // ==========================================
    function handleHash() {
        const hash = window.location.hash.slice(1) || 'home';
        const [page, param] = hash.split('=');
        const pageName = page.replace(/[^a-z]/gi, '');

        if (pageName === 'product' && param) {
            state.selectedProductId = param;
            state.page = 'product';
        } else if (['home', 'catalog', 'cart', 'checkout'].includes(pageName)) {
            state.page = pageName;
        } else {
            state.page = 'home';
        }
        renderPage();
    }

    window.addEventListener('hashchange', handleHash);

    // ==========================================
    // INITIALIZATION
    // ==========================================
    function init() {
        renderFooter();
        handleHash();
        lucide.createIcons();
    }

    // Run on DOM ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
